name: Push Vessel Preview Image

on:
  push:
    tags:
      - 'preview-v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

env:
  ACR_REGISTRY: ziwuxian-registry.cn-beijing.cr.aliyuncs.com
  ACR_NAMESPACE: ai-coding
  IMAGE_NAME: vessel-preview
  ACR_INSTANCE_ID: cri-4afbf1u4sbrqb5fy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Aliyun (OIDC)
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ secrets.ALIYUN_RAM_ROLE_ARN }}
          oidc-provider-arn: ${{ secrets.ALIYUN_OIDC_PROVIDER_ARN }}

      - name: Login to ACR Enterprise Edition
        uses: aliyun/acr-login@v1
        with:
          login-server: ${{ env.ACR_REGISTRY }}
          region-id: cn-beijing
          access-key-id: ${{ env.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          access-key-secret: ${{ env.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          security-token: ${{ env.ALIBABA_CLOUD_SECURITY_TOKEN }}
          instance-id: ${{ env.ACR_INSTANCE_ID }}

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/preview-v}
            echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.preview
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}

      - name: Image pushed summary
        run: |
          echo "### Preview Image Pushed! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
