[project]
name = "vessel-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite==0.19.0",
    "greenlet>=3.0.0",
    "python-dotenv==1.0.0",
    "python-multipart==0.0.6",
    "httpx==0.26.0",
]

[dependency-groups]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "black==23.12.1",
    "flake8==7.0.0",
]
